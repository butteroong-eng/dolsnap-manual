<h2>오늘의 촬영 흐름</h2><p class="intro">단계를 열어 체크하고, 촬영 파트에서는 원하는 장면을 눌러 예시 사진과 설정을 확인하세요.</p>
<div class="steps" id="steps"></div><p class="footer">Sony A7 III · FE 16–35mm F2.8 GM 기준 · 플래시 없이 촬영<br>사진은 장면 참고용이며 일부 행사 순간은 유사 이미지로 표시했습니다.</p></main>

<script>const SCENES=[{"step":"indoor","title":"복도 가족 3인 정면","img":"hall","tag":"실내 · 가족","script":"“아기를 가운데 두고 살짝 붙어 주세요. 모두 카메라 한번 볼게요.”","shot":"수평 맞춘 전신 → 허리 위 → 아기 표정. 광각 가장자리에는 얼굴 배치 금지.","setting":"1/320초 · F2.8 · ISO AUTO · AF-C","note":"정장 사진이면 한복 착용 전 먼저 촬영."},{"step":"indoor","title":"가족이 걸어오는 장면","img":"walk","tag":"실내 · 움직임","script":"“두세 걸음만 천천히 걸어와 주세요. 이번엔 아기를 바라보세요.”","shot":"복도 중심선 활용. 연사 3~5장, 발끝 잘림 주의.","setting":"1/500초 · F2.8 · ISO AUTO · AF-C","note":"셔터가 느리면 흔들리므로 1/500초 이상."},{"step":"indoor","title":"실내 가족 상반신","img":"family","tag":"실내 · 가족","script":"“아빠는 아기를 안정적으로 안고, 엄마는 아기 볼을 바라봐 주세요.”","shot":"아기 눈높이, 상반신과 손까지 담기. 창가 빛을 옆에서 받도록.","setting":"1/320초 · F2.8 · ISO AUTO · AF-C","note":"세 사람 눈이 서로 다른 거리면 F3.5~4 고려."},{"step":"indoor","title":"엄마와 아기 교감","img":"mom","tag":"실내 · 교감","script":"“엄마가 아기에게 조용히 이야기해 주세요. 이번엔 코를 살짝 맞대 볼게요.”","shot":"아기 얼굴과 엄마 표정 중심. 손과 얼굴이 겹치지 않게.","setting":"1/320초 · F2.8 · ISO AUTO · 눈 AF","note":"억지로 웃기기보다 아기가 엄마를 보는 순간 포착."},{"step":"outdoor","title":"정자 앞 가족 전신","img":"gazebo","tag":"실외 · 가족","script":"“두 분 어깨를 가까이, 아기는 가운데. 카메라 보고 한 번 웃어 주세요.”","shot":"정자 기둥 수직 확인. 가족이 화면 중앙, 전신 1장과 반신 1장.","setting":"1/400초 · F2.8~4 · ISO 100~AUTO","note":"역광이면 얼굴이 어두워지지 않는지 확인."},{"step":"outdoor","title":"정자에 앉은 가족","img":"sit","tag":"실외 · 가족","script":"“아빠는 아기를 안고, 엄마는 옆에서 아기 손을 잡아 주세요.”","shot":"앉은 자세에서 한복 치마와 아기 얼굴 함께 보이도록.","setting":"1/400초 · F2.8~4 · ISO AUTO","note":"치마 고름·치맛자락·버선이 말려 올라가지 않았는지 확인."},{"step":"outdoor","title":"숲길 가족 스냅","img":"forest","tag":"실외 · 자연스러움","script":"“손잡고 천천히 걸어가 볼게요. 서로 보다가 아기를 바라봐 주세요.”","shot":"숲길 선을 배경으로 전신. 인물이 배경에 묻히지 않게.","setting":"1/500초 · F2.8 · ISO AUTO · AF-C","note":"그늘에서는 ISO가 올라가도 셔터 확보 우선."},{"step":"outdoor","title":"꽃나무 배경 가족","img":"flower","tag":"실외 · 계절감","script":"“꽃 아래서 아기를 가운데 안고 서로 가까이 서 주세요.”","shot":"꽃을 전경으로 약간만 넣고 얼굴 가림 방지.","setting":"1/400초 · F2.8 · ISO AUTO","note":"얼굴에 꽃 그림자가 얼룩지면 위치 이동."},{"step":"outdoor","title":"아기 단독 전신","img":"baby","tag":"실외 · 아기"," const getDone=()=>{try{return JSON.parse(localStorage.getItem('dolsnap-v3')||'{}')}catch{return {}}};let done=getDone(),filters={};
function check(k,v){done[k]=v;try{localStorage.setItem('dolsnap-v3',JSON.stringify(done))}catch{}update()}
function update(){let n=Object.values(done).filter(Boolean).length;let t=stages.reduce((s,x)=>s+x.checks.length,0);document.getElementById('counter').textContent=n+' / '+t+' 완료';document.getElementById('progress').style.width=(100*n/t)+'%'}
function sceneCard(s,i){let card=document.createElement('div');card.className='scene';let btn=document.createElement('button');btn.className='sceneBtn';btn.innerHTML='<img class="thumb" alt="" src="'+IMAGES[s.img]+'"><span class="sceneTitle"><small>'+s.tag+'</small><b>'+s.title+'</b><small>사진 · 포즈 · 카메라 설정 보기 ›</small></span>';btn.onclick=()=>card.classList.toggle('expanded');card.appendChild(btn);let detail=document.createElement('div');detail.className='detail';let photo=document.createElement('img');photo.src=IMAGES[s.img];photo.alt=s.title+' 참고 사진';detail.appendChild(photo);for(let [label,val] of [['포즈 멘트',s.script],['구도',s.shot]]){let p=document.createElement('p');let b=document.createElement('b');b.textContent=label+'  ';p.append(b,document.createTextNode(val));detail.appendChild(p)}let st=document.createElement('div');st.className='setting';st.textContent='📷 '+s.setting;detail.appendChild(st);let note=document.createElement('p');note.className='note';note.textContent='※ '+s.note;detail.appendChild(note);card.appendChild(detail);return card}
function render(){let host=document.getElementById('steps');stages.forEach((stage,idx)=>{let el=document.createElement('section');el.className='step'+(idx===0?' open':'');el.id=stage.id;let head=document.createElement('button');head.className='stepHead';head.innerHTML='<span class="num">0'+(idx+1)+'</span><span style="flex:1"><strong>'+stage.name+'</strong><small>'+stage.sub+'</small></span><span class="chev">›</span>';head.onclick=()=>el.classList.toggle('open');el.appendChild(head);let body=document.createElement('div');body.className='body';for(let [i,item] of stage.checks.entries()){let key=stage.id+'-'+i;let row=document.createElement('label');row.className='checkrow';let cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[key];cb.onchange=()=>check(key,cb.checked);let span=document.createElement('span');span.innerHTML='<strong>'+item[0]+'</strong><small>'+item[1]+'</small>';row.append(cb,span);body.appendChild(row)}if(stage.id==='dress'){let note=document.createElement('div');note.className='callout';note.textContent='의상 구성은 가족마다 달라요. 실제 착용하는 한복·장신구만 확인하고, 아기 목을 조이는 장식은 사용하지 마세요.';body.appendChild(note)}
let relevant=SCENES.filter(s=>s.step===stage.id);if(relevant.length){let sub=document.createElement('div');sub.className='sub';sub.textContent='촬영 장면 골라보기';body.appendChild(sub);let chips=document.createElement('div');chips.className='chips';let list=document.createElement('div');let names=['전체',...new Set(relevant.map(x=>x.tag.split(' · ')[1]))];names.forEach((name,j)=>{let b=document.createElement('button');b.className='chip'+(!j?' active':'');b.textContent=name;b.onclick=()=>{chips.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');list.replaceChildren(...relevant.filter(s=>name==='전체'||s.tag.endsWith(' · '+name)).map(sceneCard))};chips.appendChild(b)});list.replaceChildren(...relevant.map(sceneCard));body.append(chips,list)}
el.appendChild(body);host.appendChild(el)});update()}
function jump(id){let el=document.getElementById(id);el.classList.add('open');el.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.fixed button').forEach(b=>b.classList.remove('on'));document.getElementById('nav-'+id).classList.add('on')}
render();</script></body></html>
